<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vailo · پنل مدیریت جدید</title>
<style>
:root{--pink:#f5d6e3;--rose:#a83d68;--wine:#6e1d3b;--paper:#fffafd;--ink:#382431;--muted:#8a7580;--line:#f0dce5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fb,#f8eaf1);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px;box-shadow:0 8px 30px #6e1d3b0a}.brand{font-size:22px;font-weight:900;color:var(--wine);letter-spacing:2px}.brand small{display:block;font-size:11px;letter-spacing:0;color:var(--muted);font-weight:400;margin-top:5px}.btn,button{border:0;border-radius:12px;padding:11px 15px;font-weight:bold;cursor:pointer;background:var(--rose);color:white}.btn.alt,button.alt{background:#f8eaf1;color:var(--wine)}button:disabled{opacity:.5;cursor:not-allowed}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #6e1d3b0a}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;color:var(--muted)}input,textarea,select{border:1px solid var(--line);background:#fffafe;border-radius:12px;padding:12px;font:inherit;outline:none;width:100%}textarea{min-height:90px;resize:vertical}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{max-width:330px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.card img{width:100%;height:160px;object-fit:cover;background:#f8eaf1}.card .body{padding:13px}.card h3{margin:0 0 7px;font-size:16px}.price{color:var(--rose);font-weight:bold}.actions{display:flex;gap:7px;margin-top:12px}.actions button{padding:9px;flex:1;font-size:12px}.notice{padding:12px;border-radius:12px;background:#fff1f7;color:var(--wine);margin:12px 0;white-space:pre-wrap}.status{font-size:12px;color:var(--muted)}.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.photos img{width:78px;height:78px;object-fit:cover;border-radius:10px}.title{margin:4px 0 12px;color:var(--wine)}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.panel{padding:15px}.top{padding:14px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:125px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><div class="wrap">
<header class="top"><div class="brand">VAILO ♡<small>پنل مدیریت مستقل · نسخه جدید</small></div><div><span id="userLabel" class="status"></span> <button id="logoutBtn" class="alt hidden">خروج</button></div></header>
<section id="login" class="panel"><h2 class="title">ورود مدیر</h2><p class="status">با حساب مدیر Supabase وارد شو.</p><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="username" placeholder="ایمیل مدیر"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور"></div></div><div class="toolbar"><button id="loginBtn">ورود</button></div><div id="loginMsg" class="notice hidden"></div></section>
<section id="app" class="hidden">
<section class="panel"><h2 class="title">افزودن / ویرایش محصول</h2><form id="productForm"><input type="hidden" id="pid"><div class="grid"><div class="field"><label>نام محصول *</label><input id="pname" required></div><div class="field"><label>قیمت (تومان) *</label><input id="price" type="number" min="0" required></div><div class="field"><label>دسته‌بندی</label><input id="category" placeholder="مثلاً اکسسوری"></div><div class="field"><label>وضعیت</label><select id="active"><option value="true">فعال</option><option value="false">غیرفعال</option></select></div><div class="field full"><label>توضیحات</label><textarea id="description"></textarea></div><div class="field full"><label>تصاویر از گوشی (چندتایی مجاز)</label><input id="photos" type="file" accept="image/*" multiple><div id="photoPreview" class="photos"></div></div></div><div class="toolbar"><button type="submit" id="saveBtn">ذخیره محصول</button><button type="button" class="alt" id="clearBtn">پاک کردن فرم</button></div><div id="formMsg" class="notice hidden"></div></form></section>
<section class="panel"><h2 class="title">محصولات ثبت‌شده</h2><div class="toolbar"><input id="search" placeholder="جستجوی نام محصول…"><button class="alt" id="refresh">تازه‌سازی</button><span id="count" class="status"></span></div><div id="listMsg" class="notice hidden"></div><div id="products" class="products"></div></section></section>
</div>
<script>
// تنظیمات فقط همین دو مقدار را با اطلاعات پروژه خودت پر کن؛ کلید service_role/secret هرگز در این فایل قرار نده.
const SUPABASE_URL='https://avgytixrohsizihfmcvq.supabase.co';
const SUPABASE_PUBLIC_KEY='PASTE_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE';
const STORAGE_BUCKET='product-images';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY);
const $=id=>document.getElementById(id);let cache=[];
function msg(el,text){el.textContent=text;el.classList.remove('hidden')}function clearMsg(el){el.textContent='';el.classList.add('hidden')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setLoggedIn(user){$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logoutBtn').classList.toggle('hidden',!user);$('userLabel').textContent=user?.email||''}
async function sessionCheck(){const {data}=await db.auth.getSession();setLoggedIn(data.session?.user||null);if(data.session?.user)loadProducts()}
$('loginBtn').onclick=async()=>{clearMsg($('loginMsg'));$('loginBtn').disabled=true;const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){msg($('loginMsg'),error.message);return}setLoggedIn(data.user);loadProducts()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();cache=[];setLoggedIn(null)};
async function loadProducts(){clearMsg($('listMsg'));$('products').innerHTML='<div class="status">در حال دریافت…</div>';const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){msg($('listMsg'),'خطا در خواندن محصولات: '+error.message+'\n(احتمالاً دسترسی RLS یا ساختار جدول)');$('products').innerHTML='';return}cache=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const rows=cache.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));$('count').textContent=`${rows.length} محصول`;if(!rows.length){$('products').innerHTML='<div class="status">محصولی پیدا نشد.</div>';return}const cards=rows.map(p=>{let img=(p.images&&p.images[0])||p.image_url||p.main_photo||'';return `<article class="card">${img?`<img src="${escapeHtml(img)}" alt="">`:'<div class="status" style="padding:40px;text-align:center">بدون تصویر</div>'}<div class="body"><h3>${escapeHtml(p.name)}</h3><div class="price">${Number(p.price||0).toLocaleString('fa-IR')} تومان</div><p class="status">${escapeHtml(p.category||'بدون دسته')} · ${p.active===false||p.is_active===false?'غیرفعال':'فعال'}</p><div class="actions"><button class="alt" data-edit="${escapeHtml(p.id)}">ویرایش</button><button data-delete="${escapeHtml(p.id)}">حذف</button></div></div></article>`}).join('');$('products').innerHTML=cards;$('products').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(cache.find(p=>String(p.id)===b.dataset.edit)));$('products').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function edit(p){if(!p)return;$('pid').value=p.id;$('pname').value=p.name||'';$('price').value=p.price||'';$('category').value=p.category||'';$('active').value=String(p.active??p.is_active??true);$('description').value=p.description||'';window.scrollTo({top:0,behavior:'smooth'})}
$('clearBtn').onclick=()=>{$('productForm').reset();$('pid').value='';$('photoPreview').innerHTML='';clearMsg($('formMsg'))};
$('photos').onchange=()=>{$('photoPreview').innerHTML='';Array.from($('photos').files||[]).slice(0,8).forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);$('photoPreview').appendChild(im)})};
async function uploadFiles(files){let urls=[];for(const f of files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from(STORAGE_BUCKET).upload(path,f,{cacheControl:'3600',upsert:false});if(error)throw error;const {data}=db.storage.from(STORAGE_BUCKET).getPublicUrl(path);urls.push(data.publicUrl)}return urls}
$('productForm').onsubmit=async e=>{e.preventDefault();clearMsg($('formMsg'));$('saveBtn').disabled=true;try{const files=Array.from($('photos').files||[]);let uploaded=files.length?await uploadFiles(files):[];let payload={name:$('pname').value.trim(),price:Number($('price').value),category:$('category').value.trim()||null,description:$('description').value.trim()||null,active:$('active').value==='true'};let existing=cache.find(p=>String(p.id)===$('pid').value);if(existing){if(uploaded.length)payload.images=[...(existing.images||[]),...uploaded];const {error}=await db.from('products').update(payload).eq('id',existing.id);if(error)throw error}else{if(uploaded.length)payload.images=uploaded;const {error}=await db.from('products').insert(payload);if(error)throw error}msg($('formMsg'),'ذخیره شد.');$('productForm').reset();$('pid').value='';$('photoPreview').innerHTML='';await loadProducts()}catch(err){msg($('formMsg'),'ذخیره ناموفق: '+(err.message||err))}finally{$('saveBtn').disabled=false}};
async function remove(id){if(!confirm('این محصول حذف شود؟'))return;const {error}=await db.from('products').delete().eq('id',id);if(error){msg($('listMsg'),'حذف ناموفق: '+error.message);return}await loadProducts()}
$('refresh').onclick=loadProducts;$('search').oninput=render;
db.auth.onAuthStateChange((_event,session)=>{setLoggedIn(session?.user||null)});sessionCheck();
</script></body></html>
